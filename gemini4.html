<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Desert — Procedural Three.js</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a0f07;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    color: #f7e6d0;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Subtle cinematic vignette */
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(18,8,2,0.52) 100%);
    z-index: 2;
  }

  /* Telemetry readout */
  #telemetry {
    position: fixed;
    top: 18px;
    left: 20px;
    z-index: 10;
    padding: 11px 15px;
    background: rgba(20, 11, 5, 0.46);
    border: 1px solid rgba(255, 200, 138, 0.2);
    border-radius: 8px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 11px;
    letter-spacing: 0.08em;
    min-width: 176px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }

  .stat-label {
    color: rgba(247, 215, 178, 0.65);
  }

  .stat-value {
    color: #fff2e0;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* Bottom controls */
  #controls {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 18px;
    background: rgba(20, 11, 5, 0.52);
    border: 1px solid rgba(255, 200, 138, 0.22);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  .slider-group {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(247, 215, 178, 0.85);
  }

  .slider-group span.val {
    min-width: 52px;
    text-align: right;
    color: #fff2e0;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 150px;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 208, 156, 0.25);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffb463;
    border: 2px solid #2b1507;
    box-shadow: 0 0 10px rgba(255, 164, 72, 0.7);
    transition: transform 0.15s ease;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.18);
  }

  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffb463;
    border: 2px solid #2b1507;
    box-shadow: 0 0 10px rgba(255, 164, 72, 0.7);
    cursor: pointer;
  }

  #stormBtn {
    appearance: none;
    border: 1px solid rgba(255, 152, 66, 0.55);
    background: linear-gradient(135deg, rgba(214, 92, 24, 0.72), rgba(148, 48, 10, 0.82));
    color: #fff4e6;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 18px rgba(214, 92, 24, 0.25);
    white-space: nowrap;
  }

  #stormBtn:hover {
    background: linear-gradient(135deg, rgba(236, 108, 32, 0.88), rgba(176, 58, 12, 0.92));
    border-color: rgba(255, 185, 110, 0.85);
    box-shadow: 0 0 24px rgba(235, 110, 30, 0.45);
  }

  #stormBtn.active {
    background: linear-gradient(135deg, rgba(255, 130, 38, 0.95), rgba(196, 62, 10, 0.95));
    border-color: #ffd099;
    box-shadow: 0 0 26px rgba(255, 126, 36, 0.75);
  }

  @media (max-width: 560px) {
    #controls {
      flex-direction: column;
      gap: 12px;
      width: calc(100% - 32px);
    }
    input[type="range"] {
      width: 140px;
    }
  }
</style>
</head>
<body>
<div id="vignette"></div>

<div id="telemetry">
  <div class="stat-row"><span class="stat-label">WIND</span><span class="stat-value" id="windVal">8.0 m/s</span></div>
  <div class="stat-row"><span class="stat-label">VISIBILITY</span><span class="stat-value" id="visVal">1450 m</span></div>
  <div class="stat-row"><span class="stat-label">FPS</span><span class="stat-value" id="fpsVal">60</span></div>
</div>

<div id="controls">
  <div class="slider-group">
    <label for="windSlider">WIND</label>
    <input id="windSlider" type="range" min="0" max="30" step="0.5" value="8">
    <span class="val" id="sliderVal">8.0 m/s</span>
  </div>
  <button id="stormBtn" type="button">Sandstorm</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ============================================================================
// RENDERER, SCENE, CAMERA
// ============================================================================
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  52,
  window.innerWidth / window.innerHeight,
  0.25,
  900
);

// ============================================================================
// SHARED PROCEDURAL DUNE HEIGHT FUNCTION (IDENTICAL IN JS & GLSL)
// ============================================================================
function duneHeightJS(x, z) {
  // Domain warp for organic sweeping barchan/transverse dune lines
  const wx = x + Math.sin(z * 0.017 + 0.5) * 14.0 + Math.sin(z * 0.039 - x * 0.011) * 5.0;
  const wz = z + Math.cos(x * 0.015 - 0.3) * 12.0;

  // Sharp-crested primary dunes using smoothed absolute sine ridge
  const s1 = Math.sin(wx * 0.043 + wz * 0.019);
  const r1 = 1.0 - Math.sqrt(s1 * s1 + 0.018);

  const s2 = Math.sin(wx * 0.029 - wz * 0.041 + 1.7);
  const r2 = 1.0 - Math.sqrt(s2 * s2 + 0.025);

  const s3 = Math.sin(wx * 0.085 + wz * 0.062 - 0.9);
  const r3 = 1.0 - Math.sqrt(s3 * s3 + 0.035);

  const swell = Math.sin(x * 0.011 + z * 0.009) * 4.5 + Math.cos(x * 0.007 - z * 0.013) * 3.5;

  return r1 * r1 * 11.5 + r2 * r2 * 6.8 + r3 * 1.9 + swell;
}

const DUNE_GLSL = /* glsl */ `
float duneHeight(vec2 p) {
  float wx = p.x + sin(p.y * 0.017 + 0.5) * 14.0 + sin(p.y * 0.039 - p.x * 0.011) * 5.0;
  float wz = p.y + cos(p.x * 0.015 - 0.3) * 12.0;

  float s1 = sin(wx * 0.043 + wz * 0.019);
  float r1 = 1.0 - sqrt(s1 * s1 + 0.018);

  float s2 = sin(wx * 0.029 - wz * 0.041 + 1.7);
  float r2 = 1.0 - sqrt(s2 * s2 + 0.025);

  float s3 = sin(wx * 0.085 + wz * 0.062 - 0.9);
  float r3 = 1.0 - sqrt(s3 * s3 + 0.035);

  float swell = sin(p.x * 0.011 + p.y * 0.009) * 4.5 + cos(p.x * 0.007 - p.y * 0.013) * 3.5;

  return r1 * r1 * 11.5 + r2 * r2 * 6.8 + r3 * 1.9 + swell;
}
`;

// ============================================================================
// SHARED UNIFORMS
// ============================================================================
const sunDir = new THREE.Vector3(-0.34, 0.135, -0.93).normalize();

const sharedUniforms = {
  uTime: { value: 0 },
  uSunDir: { value: sunDir.clone() },
  uFogColor: { value: new THREE.Color(0xe8a463) },
  uFogDensity: { value: 0.0032 },
  uStorm: { value: 0.0 },        // 0 = clear golden hour, 1 = full whiteout/orangeout storm
  uWallProgress: { value: 0.0 }, // 0 = far horizon, 1 = engulfed camera
  uWind: { value: 8.0 },
  uCamPos: { value: new THREE.Vector3() }
};

// ============================================================================
// 1. PROCEDURAL GOLDEN-HOUR SKY DOME
// ============================================================================
const skyGeo = new THREE.SphereGeometry(720, 32, 20);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    uSunDir: sharedUniforms.uSunDir,
    uFogColor: sharedUniforms.uFogColor,
    uStorm: sharedUniforms.uStorm,
    uTime: sharedUniforms.uTime
  },
  vertexShader: /* glsl */ `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */ `
    uniform vec3 uSunDir;
    uniform vec3 uFogColor;
    uniform float uStorm;
    uniform float uTime;
    varying vec3 vDir;

    void main() {
      vec3 dir = normalize(vDir);
      float h = clamp(dir.y, 0.0, 1.0);

      // Golden hour palette
      vec3 zenithClear = vec3(0.16, 0.25, 0.44);
      vec3 midClear    = vec3(0.68, 0.45, 0.34);
      vec3 horizClear  = vec3(0.95, 0.66, 0.37);

      // Storm palette (thick burnt orange)
      vec3 zenithStorm = vec3(0.55, 0.22, 0.05);
      vec3 midStorm    = vec3(0.76, 0.33, 0.08);
      vec3 horizStorm  = vec3(0.86, 0.40, 0.11);

      vec3 zenith = mix(zenithClear, zenithStorm, uStorm);
      vec3 mid    = mix(midClear, midStorm, uStorm);
      vec3 horiz  = mix(horizClear, horizStorm, uStorm);

      vec3 col = mix(horiz, mid, smoothstep(0.0, 0.26, h));
      col = mix(col, zenith, smoothstep(0.22, 0.82, h));

      // Sun disc & atmospheric Mie glow
      float sunDot = max(dot(dir, normalize(uSunDir)), 0.0);
      float sunGlow = pow(sunDot, 10.0) * 0.48 + pow(sunDot, 72.0) * 0.65;
      float sunDisc = smoothstep(0.9986, 0.99945, sunDot);

      // Sun fades into a ghostly orb during storm
      float sunVis = mix(1.0, 0.14, smoothstep(0.15, 0.95, uStorm));
      col += vec3(1.0, 0.72, 0.35) * sunGlow * sunVis;
      col += vec3(1.0, 0.93, 0.78) * sunDisc * 2.4 * sunVis;

      // Blend seamlessly into fog color right at the horizon
      float horizBlend = 1.0 - smoothstep(0.0, 0.12 + uStorm * 0.25, max(dir.y, 0.0));
      col = mix(col, uFogColor, horizBlend);

      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const skyMesh = new THREE.Mesh(skyGeo, skyMat);
scene.add(skyMesh);

// ============================================================================
// 2. ENDLESS PROCEDURAL SAND DUNES
// ============================================================================
const TERRAIN_SIZE = 440;
const TERRAIN_SEGS = 190;
const CELL_SIZE = TERRAIN_SIZE / TERRAIN_SEGS;

const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGS, TERRAIN_SEGS);
terrainGeo.rotateX(-Math.PI / 2);

const terrainMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: sharedUniforms.uTime,
    uSunDir: sharedUniforms.uSunDir,
    uFogColor: sharedUniforms.uFogColor,
    uFogDensity: sharedUniforms.uFogDensity,
    uStorm: sharedUniforms.uStorm,
    uWind: sharedUniforms.uWind,
    uOffset: { value: new THREE.Vector2(0, 0) }
  },
  vertexShader: /* glsl */ `
    uniform vec2 uOffset;
    varying vec3 vWorldPos;
    varying vec3 vNormal;
    varying float vHeight;
    varying float vCrest;

    ${DUNE_GLSL}

    void main() {
      vec3 pos = position;
      vec2 worldXZ = pos.xz + uOffset;

      float h = duneHeight(worldXZ);
      pos.y = h;

      // Finite-difference normal for crisp dune ridges
      float eps = 0.55;
      float hx = duneHeight(worldXZ + vec2(eps, 0.0));
      float hz = duneHeight(worldXZ + vec2(0.0, eps));
      vec3 n = normalize(vec3(h - hx, eps, h - hz));

      // Approximate crest curvature for warm rim-lit sand & wind-blown sheen
      float hmx = duneHeight(worldXZ - vec2(eps, 0.0));
      float hmz = duneHeight(worldXZ - vec2(0.0, eps));
      float laplacian = (hx + hmx + hz + hmz - 4.0 * h);
      vCrest = clamp(-laplacian * 1.4, 0.0, 1.0);

      vHeight = h;
      vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
      vWorldPos = worldPosition.xyz;
      vNormal = n;

      gl_Position = projectionMatrix * viewMatrix * worldPosition;
    }
  `,
  fragmentShader: /* glsl */ `
    uniform vec3 uSunDir;
    uniform vec3 uFogColor;
    uniform float uFogDensity;
    uniform float uStorm;
    uniform float uWind;
    uniform float uTime;

    varying vec3 vWorldPos;
    varying vec3 vNormal;
    varying float vHeight;
    varying float vCrest;

    float hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    void main() {
      vec3 N = normalize(vNormal);
      vec3 L = normalize(uSunDir);
      vec3 V = normalize(cameraPosition - vWorldPos);
      float dist = length(cameraPosition - vWorldPos);

      // Fine wind-sculpted sand ripples (fade out with distance to prevent aliasing)
      float rippleFade = 1.0 - smoothstep(25.0, 140.0, dist);
      float ripplePhase = vWorldPos.x * 2.1 + vWorldPos.z * 0.9 + sin(vWorldPos.z * 0.35) * 1.8;
      float ripple = sin(ripplePhase * 3.2) * 0.045 * rippleFade;
      N = normalize(N + vec3(ripple, 0.0, ripple * 0.5));

      // Warm golden-hour sand shading
      float NdotL = dot(N, L);
      float diff = smoothstep(-0.18, 0.95, NdotL);

      vec3 shadowCol = mix(vec3(0.42, 0.21, 0.13), vec3(0.36, 0.13, 0.04), uStorm);
      vec3 litCol    = mix(vec3(0.95, 0.67, 0.39), vec3(0.84, 0.38, 0.12), uStorm);
      vec3 crestCol  = mix(vec3(1.00, 0.80, 0.52), vec3(0.92, 0.45, 0.15), uStorm);

      // Subtle height-based trough darkening
      float ao = smoothstep(-6.0, 14.0, vHeight) * 0.25 + 0.75;
      vec3 sand = mix(shadowCol, litCol, diff) * ao;
      sand = mix(sand, crestCol, vCrest * 0.32 * diff);

      // Soft warm specular & micro-grain sparkle
      vec3 H = normalize(L + V);
      float spec = pow(max(dot(N, H), 0.0), 28.0) * 0.18 * (1.0 - uStorm * 0.8);
      float grain = hash21(floor(vWorldPos.xz * 7.5));
      float sparkle = step(0.985, grain) * pow(max(dot(N, H), 0.0), 12.0) * 0.45 * rippleFade * (1.0 - uStorm);

      // Backlit rim on sharp dune crests
      float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0) * max(dot(V, -L), 0.0);
      vec3 rimLight = vec3(1.0, 0.68, 0.32) * rim * 0.32 * (1.0 - uStorm * 0.6);

      vec3 col = sand + vec3(1.0, 0.84, 0.58) * (spec + sparkle) + rimLight;

      // Exponential squared fog blending seamlessly into the horizon
      float fogFactor = 1.0 - exp(-pow(dist * uFogDensity, 1.85));
      col = mix(col, uFogColor, clamp(fogFactor, 0.0, 1.0));

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
scene.add(terrainMesh);

// ============================================================================
// 3. WIND-BLOWN CREST SAND PARTICLES (GPU-ANIMATED)
// ============================================================================
const CREST_PARTICLE_COUNT = 3200;
const crestGeo = new THREE.BufferGeometry();
const crestSeeds = new Float32Array(CREST_PARTICLE_COUNT * 4);
const crestPos = new Float32Array(CREST_PARTICLE_COUNT * 3);

for (let i = 0; i < CREST_PARTICLE_COUNT; i++) {
  // x, z local offsets in [-95, 95], phase [0, 1], size/speed seed
  crestSeeds[i * 4 + 0] = (Math.random() - 0.5) * 190;
  crestSeeds[i * 4 + 1] = (Math.random() - 0.5) * 190;
  crestSeeds[i * 4 + 2] = Math.random();
  crestSeeds[i * 4 + 3] = 0.5 + Math.random() * 1.0;

  crestPos[i * 3 + 0] = 0;
  crestPos[i * 3 + 1] = 0;
  crestPos[i * 3 + 2] = 0;
}

crestGeo.setAttribute('position', new THREE.BufferAttribute(crestPos, 3));
crestGeo.setAttribute('aSeed', new THREE.BufferAttribute(crestSeeds, 4));

const crestMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  uniforms: {
    uTime: sharedUniforms.uTime,
    uWind: sharedUniforms.uWind,
    uStorm: sharedUniforms.uStorm,
    uCamPos: sharedUniforms.uCamPos,
    uFogColor: sharedUniforms.uFogColor,
    uFogDensity: sharedUniforms.uFogDensity
  },
  vertexShader: /* glsl */ `
    attribute vec4 aSeed;
    uniform float uTime;
    uniform float uWind;
    uniform float uStorm;
    uniform vec3 uCamPos;

    varying float vAlpha;
    varying float vDist;

    ${DUNE_GLSL}

    void main() {
      float effectiveWind = max(uWind, uStorm * 28.0);
      float windNorm = clamp(effectiveWind / 30.0, 0.0, 1.0);

      // Wrap particle domain around camera XZ
      float span = 190.0;
      vec2 baseXZ = uCamPos.xz + aSeed.xy;
      // Drift with wind along +X / +Z
      float life = fract(aSeed.z + uTime * (0.12 + windNorm * 0.42) * aSeed.w);
      vec2 drift = vec2(1.0, 0.35) * life * (4.0 + effectiveWind * 1.45);

      vec2 pXZ = baseXZ + drift;
      // Keep wrapped around camera
      pXZ = uCamPos.xz + mod(pXZ - uCamPos.xz + span * 0.5, span) - span * 0.5;

      float h = duneHeight(pXZ);
      // Sample nearby to check if near a dune crest (higher elevation)
      float crestMask = smoothstep(5.5, 13.5, h);

      // Lift off the crest and arc downwind
      float lift = sin(life * 3.14159) * (0.6 + windNorm * 3.8) * aSeed.w + 0.15;
      vec3 worldPos = vec3(pXZ.x, h + lift, pXZ.y);

      vec4 mvPos = viewMatrix * vec4(worldPos, 1.0);
      vDist = -mvPos.z;

      float fadeLife = sin(life * 3.14159);
      float windVis = smoothstep(1.5, 10.0, effectiveWind);
      vAlpha = fadeLife * crestMask * windVis * 0.55;

      float size = (9.0 + windNorm * 14.0) * aSeed.w;
      gl_PointSize = clamp(size * (120.0 / max(vDist, 1.0)), 1.5, 42.0);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: /* glsl */ `
    uniform vec3 uFogColor;
    uniform float uFogDensity;
    uniform float uStorm;
    varying float vAlpha;
    varying float vDist;

    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      // Elongated wind-streaked sand wisp
      uv.y *= 1.8;
      float r = length(uv);
      float soft = smoothstep(0.5, 0.05, r);

      float alpha = soft * vAlpha;
      if (alpha < 0.01) discard;

      vec3 col = mix(vec3(0.98, 0.78, 0.50), vec3(0.92, 0.48, 0.18), uStorm);
      float fogFactor = 1.0 - exp(-pow(vDist * uFogDensity, 1.85));
      col = mix(col, uFogColor, clamp(fogFactor, 0.0, 1.0));

      gl_FragColor = vec4(col, alpha * (1.0 - fogFactor * 0.7));
    }
  `
});

const crestParticles = new THREE.Points(crestGeo, crestMat);
crestParticles.frustumCulled = false;
scene.add(crestParticles);

// ============================================================================
// 4. MASSIVE ADVANCING ORANGE DUST WALL (HABOOB)
// ============================================================================
// Curved towering wall that rolls in from the horizon over ~5 seconds
const wallGeo = new THREE.CylinderGeometry(165, 165, 145, 72, 24, true, Math.PI * 0.55, Math.PI * 0.9);
const wallMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  uniforms: {
    uTime: sharedUniforms.uTime,
    uWallProgress: sharedUniforms.uWallProgress,
    uStorm: sharedUniforms.uStorm
  },
  vertexShader: /* glsl */ `
    uniform float uTime;
    varying vec2 vUv;
    varying float vWorldY;

    void main() {
      vUv = uv;
      vec3 pos = position;
      // Billowing turbulence along the leading face of the dust wall
      float wave = sin(uv.x * 18.0 + uTime * 1.4) * 5.5
                 + cos(uv.y * 10.0 - uTime * 2.1) * 4.0
                 + sin((uv.x * 32.0 + uv.y * 14.0) - uTime * 2.8) * 2.2;
      pos += normalize(vec3(pos.x, 0.0, pos.z)) * wave;

      vec4 wp = modelMatrix * vec4(pos, 1.0);
      vWorldY = wp.y;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */ `
    uniform float uTime;
    uniform float uWallProgress;
    uniform float uStorm;
    varying vec2 vUv;
    varying float vWorldY;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
        f.y
      );
    }

    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 4; i++) {
        v += a * noise(p);
        p = p * 2.03 + vec2(1.7, 9.2);
        a *= 0.5;
      }
      return v;
    }

    void main() {
      // Rolling turbulent dust clouds
      vec2 uv = vUv;
      float n1 = fbm(vec2(uv.x * 7.5 + uTime * 0.16, uv.y * 4.2 - uTime * 0.28));
      float n2 = fbm(vec2(uv.x * 14.0 - uTime * 0.25, uv.y * 8.0 - uTime * 0.45));
      float cloud = n1 * 0.65 + n2 * 0.35;

      // Billowing irregular top edge of the haboob
      float topMask = 1.0 - smoothstep(0.48 + cloud * 0.34, 0.72 + cloud * 0.26, uv.y);
      // Soft side edges
      float sideMask = smoothstep(0.0, 0.16, uv.x) * (1.0 - smoothstep(0.84, 1.0, uv.x));

      // Fade in as wall approaches, fade out once completely inside dense storm fog
      float appear = smoothstep(0.01, 0.14, uWallProgress);
      float density = topMask * sideMask * appear * smoothstep(0.18, 0.72, cloud + (1.0 - uv.y) * 0.55);

      // Dark brooding dust base, fiery backlit orange upper rim
      vec3 baseCol = vec3(0.46, 0.15, 0.03);
      vec3 midCol  = vec3(0.84, 0.36, 0.09);
      vec3 rimCol  = vec3(1.00, 0.62, 0.24);

      vec3 col = mix(baseCol, midCol, smoothstep(0.1, 0.65, uv.y + cloud * 0.25));
      col = mix(col, rimCol, smoothstep(0.55, 0.92, uv.y + n2 * 0.3) * 0.75);

      if (density < 0.01) discard;
      gl_FragColor = vec4(col, clamp(density * 0.96, 0.0, 0.96));
    }
  `
});

const dustWall = new THREE.Mesh(wallGeo, wallMat);
dustWall.visible = false;
scene.add(dustWall);

// ============================================================================
// 5. HIGH-SPEED SANDSTORM PARTICLES FLYING PAST CAMERA
// ============================================================================
const STORM_PARTICLE_COUNT = 2600;
const stormGeo = new THREE.BufferGeometry();
const stormSeeds = new Float32Array(STORM_PARTICLE_COUNT * 4);
const stormPos = new Float32Array(STORM_PARTICLE_COUNT * 3);

for (let i = 0; i < STORM_PARTICLE_COUNT; i++) {
  stormSeeds[i * 4 + 0] = (Math.random() - 0.5) * 44; // local X
  stormSeeds[i * 4 + 1] = (Math.random() - 0.5) * 20; // local Y
  stormSeeds[i * 4 + 2] = (Math.random() - 0.5) * 44; // local Z
  stormSeeds[i * 4 + 3] = 0.4 + Math.random() * 1.2;  // speed/size
}

stormGeo.setAttribute('position', new THREE.BufferAttribute(stormPos, 3));
stormGeo.setAttribute('aSeed', new THREE.BufferAttribute(stormSeeds, 4));

const stormMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: {
    uTime: sharedUniforms.uTime,
    uStorm: sharedUniforms.uStorm,
    uCamPos: sharedUniforms.uCamPos
  },
  vertexShader: /* glsl */ `
    attribute vec4 aSeed;
    uniform float uTime;
    uniform float uStorm;
    uniform vec3 uCamPos;

    varying float vAlpha;
    varying float vType;

    void main() {
      vec3 box = vec3(44.0, 20.0, 44.0);
      // Fast wind sweeping across camera view
      vec3 vel = vec3(26.0, -2.5, 18.0) * aSeed.w;
      vec3 p = aSeed.xyz + vel * uTime;
      // Wrap tightly inside box around camera
      vec3 rel = mod(p + box * 0.5, box) - box * 0.5;
      vec3 worldPos = uCamPos + rel;

      vec4 mvPos = viewMatrix * vec4(worldPos, 1.0);
      float dist = max(-mvPos.z, 0.5);

      // Mix of sharp sand grains and larger translucent dust puffs
      vType = step(0.84, fract(aSeed.w * 7.13));
      float baseSize = mix(4.5, 34.0, vType) * aSeed.w;
      gl_PointSize = clamp(baseSize * (16.0 / dist), 1.2, 68.0);

      float edgeFade = smoothstep(0.5, 3.0, dist) * (1.0 - smoothstep(14.0, 24.0, dist));
      vAlpha = uStorm * edgeFade * mix(0.75, 0.24, vType);

      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: /* glsl */ `
    varying float vAlpha;
    varying float vType;

    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      // Streak sand grains horizontally; keep dust puffs soft and round
      uv.y *= mix(2.8, 1.15, vType);
      float r = length(uv);
      float mask = smoothstep(0.5, 0.08, r);
      float alpha = mask * vAlpha;
      if (alpha < 0.01) discard;

      vec3 grainCol = vec3(1.0, 0.68, 0.34);
      vec3 puffCol  = vec3(0.86, 0.38, 0.11);
      vec3 col = mix(grainCol, puffCol, vType);

      gl_FragColor = vec4(col, alpha);
    }
  `
});

const stormParticles = new THREE.Points(stormGeo, stormMat);
stormParticles.frustumCulled = false;
scene.add(stormParticles);

// ============================================================================
// UI & STATE
// ============================================================================
const windSlider = document.getElementById('windSlider');
const sliderVal = document.getElementById('sliderVal');
const stormBtn = document.getElementById('stormBtn');
const windValEl = document.getElementById('windVal');
const visValEl = document.getElementById('visVal');
const fpsValEl = document.getElementById('fpsVal');

let userWind = 8.0;
let stormActive = false;
let stormTimer = 0.0; // 0 -> 5.0 seconds roll-in
const STORM_DURATION = 5.0;

windSlider.addEventListener('input', () => {
  userWind = parseFloat(windSlider.value);
  sliderVal.textContent = `${userWind.toFixed(1)} m/s`;
});

stormBtn.addEventListener('click', () => {
  stormActive = !stormActive;
  stormBtn.classList.toggle('active', stormActive);
  stormBtn.textContent = stormActive ? 'Clear Storm' : 'Sandstorm';
});

// ============================================================================
// ANIMATION LOOP
// ============================================================================
const clock = new THREE.Clock();
let elapsed = 0;

// Smooth FPS counter
let frameCount = 0;
let fpsAccum = 0;
let displayFps = 60;

// Colors for interpolation
const clearFogColor = new THREE.Color(0xe8a463);
const stormFogColor = new THREE.Color(0xc85514);
const tmpForward = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // Update FPS readout every 0.35s
  frameCount++;
  fpsAccum += dt;
  if (fpsAccum >= 0.35) {
    displayFps = Math.round(frameCount / fpsAccum);
    fpsValEl.textContent = displayFps;
    frameCount = 0;
    fpsAccum = 0;
  }

  // Advance or recede sandstorm over ~5 seconds
  if (stormActive) {
    stormTimer = Math.min(STORM_DURATION, stormTimer + dt);
  } else {
    stormTimer = Math.max(0, stormTimer - dt * 1.15);
  }

  const wallProgress = stormTimer / STORM_DURATION; // 0 -> 1 over 5s
  // Engulfment ramps sharply in the last 1.6 seconds as the dust wall hits the camera
  const stormIntensity = THREE.MathUtils.smoothstep(wallProgress, 0.58, 1.0);

  // Slow cinematic camera drifting endlessly over the dunes
  const speed = 6.2;
  const camX = elapsed * speed * 0.45 + Math.sin(elapsed * 0.08) * 28.0;
  const camZ = -elapsed * speed;
  const groundY = duneHeightJS(camX, camZ);

  // Gentle vertical float + subtle buffeting during sandstorm
  const shakeAmt = stormIntensity * 0.24 + (userWind / 30.0) * 0.03;
  const shakeX = (Math.sin(elapsed * 29.0) + Math.cos(elapsed * 43.0)) * shakeAmt;
  const shakeY = (Math.cos(elapsed * 33.0) + Math.sin(elapsed * 51.0)) * shakeAmt;

  const targetY = Math.max(groundY + 7.5, 14.0) + Math.sin(elapsed * 0.22) * 1.8;
  camera.position.set(camX + shakeX, targetY + shakeY, camZ);

  // Look smoothly ahead along the curved flight path
  const lookX = camX + 18.0 + Math.cos(elapsed * 0.08) * 14.0;
  const lookZ = camZ - 48.0;
  const lookY = duneHeightJS(lookX, lookZ) + 4.2 + Math.sin(elapsed * 0.15) * 1.2;
  camera.lookAt(lookX, lookY, lookZ);
  // Subtle cinematic banking roll
  camera.rotation.z += Math.sin(elapsed * 0.08) * 0.045;

  // Keep sky dome centered on camera
  skyMesh.position.copy(camera.position);

  // Snap terrain mesh to grid cell size around camera for zero-swimming endless dunes
  const snapX = Math.floor(camX / CELL_SIZE) * CELL_SIZE;
  const snapZ = Math.floor(camZ / CELL_SIZE) * CELL_SIZE;
  terrainMesh.position.set(snapX, 0, snapZ);
  terrainMat.uniforms.uOffset.value.set(snapX, snapZ);

  // Position & advance the massive orange dust wall from horizon to camera
  if (wallProgress > 0.002) {
    dustWall.visible = true;
    camera.getWorldDirection(tmpForward);
    tmpForward.y = 0;
    tmpForward.normalize();

    // Wall starts 260m ahead and rolls in to engulf the camera
    const wallDist = THREE.MathUtils.lerp(250, -18, Math.pow(wallProgress, 1.15));
    dustWall.position.set(
      camera.position.x + tmpForward.x * wallDist,
      camera.position.y + 34,
      camera.position.z + tmpForward.z * wallDist
    );
    // Orient concave side toward camera
    dustWall.rotation.y = Math.atan2(tmpForward.x, tmpForward.z);
  } else {
    dustWall.visible = false;
  }

  // Update atmosphere, fog, and wind uniforms
  const effectiveWind = THREE.MathUtils.lerp(userWind, Math.max(userWind, 29.5), stormIntensity);
  const clearFogDensity = 0.0029 + (userWind / 30.0) * 0.0018;
  const stormFogDensity = 0.068;
  const currentFogDensity = THREE.MathUtils.lerp(clearFogDensity, stormFogDensity, stormIntensity);

  sharedUniforms.uTime.value = elapsed;
  sharedUniforms.uWind.value = effectiveWind;
  sharedUniforms.uStorm.value = stormIntensity;
  sharedUniforms.uWallProgress.value = wallProgress;
  sharedUniforms.uFogDensity.value = currentFogDensity;
  sharedUniforms.uFogColor.value.copy(clearFogColor).lerp(stormFogColor, stormIntensity);
  sharedUniforms.uCamPos.value.copy(camera.position);

  // Update telemetry readout
  windValEl.textContent = `${effectiveWind.toFixed(1)} m/s`;
  const visibilityMeters = Math.max(12, Math.round(4.6 / currentFogDensity));
  visValEl.textContent = `${visibilityMeters} m`;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
