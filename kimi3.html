<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERG — Golden Hour</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;}
  canvas{display:block;}
  .bar{position:fixed;left:0;right:0;height:6vh;background:#000;z-index:6;pointer-events:none;}
  .bar.top{top:0}.bar.bottom{bottom:0}
  #vignette{position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(8,3,0,.28) 82%, rgba(5,2,0,.55) 100%);}
  #tint{position:fixed;inset:0;z-index:3;pointer-events:none;background:#ff7a1e;
    mix-blend-mode:multiply;opacity:0;}
  #hud{position:fixed;top:calc(6vh + 16px);left:20px;z-index:10;color:#ffe6c4;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;
    letter-spacing:2px;line-height:1.9;text-shadow:0 1px 3px rgba(0,0,0,.6);
    user-select:none;pointer-events:none;}
  #hud .row{display:flex;gap:14px;}
  #hud .k{opacity:.55;width:96px;}
  #hud .v{color:#ffd29a;}
  #ui{position:fixed;bottom:calc(6vh + 20px);left:50%;transform:translateX(-50%);
    z-index:10;display:flex;align-items:center;gap:20px;padding:11px 22px;
    background:rgba(24,12,5,.38);border:1px solid rgba(255,196,140,.22);
    border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  #ui label{color:#ffd9ae;font-size:10px;letter-spacing:2.5px;display:flex;
    align-items:center;gap:10px;user-select:none;white-space:nowrap;}
  #windVal{color:#fff;min-width:30px;text-align:right;font-family:ui-monospace,Menlo,monospace;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:210px;height:2px;
    background:linear-gradient(90deg,#7a3c14,#ffc788);border-radius:2px;outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;
    border-radius:50%;background:#ffe0b8;border:2px solid rgba(120,60,20,.8);
    box-shadow:0 0 10px rgba(255,180,110,.55);}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;
    background:#ffe0b8;border:2px solid rgba(120,60,20,.8);}
  #stormBtn{background:transparent;border:1px solid rgba(255,190,130,.55);color:#ffd9b0;
    font-family:inherit;font-size:10px;letter-spacing:3px;padding:9px 20px;border-radius:999px;
    cursor:pointer;transition:all .25s ease;white-space:nowrap;}
  #stormBtn:hover{background:rgba(255,150,80,.18);color:#fff;}
  #stormBtn.active{background:#a34d12;border-color:#ffb37a;color:#fff;
    box-shadow:0 0 18px rgba(255,120,30,.45);}
  #brand{position:fixed;top:calc(6vh + 16px);right:22px;z-index:10;color:#ffdcb2;
    font-size:10px;letter-spacing:5px;opacity:.6;user-select:none;pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.6);}
</style>
</head>
<body>
<div class="bar top"></div><div class="bar bottom"></div>
<div id="vignette"></div><div id="tint"></div>
<div id="hud">
  <div class="row"><span class="k">WIND</span><span class="v" id="hudW">6.0 m/s</span></div>
  <div class="row"><span class="k">VISIBILITY</span><span class="v" id="hudV">9.0 km</span></div>
  <div class="row"><span class="k">FPS</span><span class="v" id="hudF">—</span></div>
</div>
<div id="brand">ERG &middot; GOLDEN HOUR</div>
<div id="ui">
  <label>WIND <input type="range" id="wind" min="0" max="30" step="0.5" value="6"> <span id="windVal">6.0</span> m/s</label>
  <button id="stormBtn">SANDSTORM</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* ============================== NOISE (CPU, mirrored in GLSL) ============================== */
const WA = 0.6, cWA = Math.cos(WA), sWA = Math.sin(WA);
const C_FREQ = 0.011, C_AMP = 26.0, C_SHARP = 1.35;

function hash2i(ix, iz){
  let n = (Math.imul(ix | 0, 374761393) + Math.imul(iz | 0, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n = n ^ (n >>> 16);
  return (n >>> 0) / 4294967296;
}
function vnoise(x, z){
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash2i(ix, iz), b = hash2i(ix + 1, iz), c = hash2i(ix, iz + 1), d = hash2i(ix + 1, iz + 1);
  const ab = a + (b - a) * ux, cd = c + (d - c) * ux;
  return ab + (cd - ab) * uz;
}
function fbm(x, z, oct){
  let v = 0, a = 0.5, t = 0, f = 1;
  for (let i = 0; i < oct; i++){ v += a * vnoise(x * f, z * f); t += a; f *= 2.03; a *= 0.5; }
  return (v / t) * 2 - 1;
}
function crestAt(x, z){
  const u = x * cWA + z * sWA, v = -x * sWA + z * cWA;
  const wob = fbm(v * 0.0035 + 7.3, u * 0.0008, 3) * 6.0;
  return Math.pow(Math.abs(Math.sin((u * C_FREQ + wob) * Math.PI)), C_SHARP);
}
function duneHeight(x, z){
  const crest = crestAt(x, z);
  const dmod = 0.55 + 0.225 * (fbm(x * 0.0012 + 3.1, z * 0.0012, 3) + 1.0);
  return crest * C_AMP * dmod + fbm(x * 0.0009, z * 0.0009, 4) * 14.0 + vnoise(x * 0.02, z * 0.02) * 0.55;
}
const smooth01 = (t) => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); };
const sstep = (a, b, x) => smooth01((x - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;

/* ============================== RENDERER / SCENE ============================== */
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.5, 9000);

const FOG_CLEAR = new THREE.Color(0xf0b678);
const FOG_STORM = new THREE.Color(0xa3500f);
scene.fog = new THREE.Fog(FOG_CLEAR.clone(), 300, 3000);

const sunDir = new THREE.Vector3(-0.85, 0.135, 0.35).normalize();
const windDir = new THREE.Vector3(cWA, 0, sWA).normalize();
const perpDir = new THREE.Vector3(-sWA, 0, cWA);

const SUN_CLEAR = new THREE.Color(0xffb377), SUN_STORM = new THREE.Color(0xff7a26);
const HSKY_CLEAR = new THREE.Color(0x6f7bb0), HSKY_STORM = new THREE.Color(0x8a4318);
const HGND_CLEAR = new THREE.Color(0x8a4a24), HGND_STORM = new THREE.Color(0x4a220c);

const sun = new THREE.DirectionalLight(SUN_CLEAR.getHex(), 2.6);
sun.position.copy(sunDir).multiplyScalar(1000);
scene.add(sun);
const hemi = new THREE.HemisphereLight(HSKY_CLEAR.getHex(), HGND_CLEAR.getHex(), 0.78);
scene.add(hemi);

/* ============================== SKY ============================== */
const skyUniforms = {
  uSunDir:  { value: sunDir },
  uHorizon: { value: new THREE.Color(0xf0b678) },
  uZenith:  { value: new THREE.Color(0x46557f) },
  uSunCol:  { value: new THREE.Color(0xffd9a0) },
  uStorm:   { value: 0 }
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(5500, 48, 28),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: skyUniforms,
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 uSunDir, uHorizon, uZenith, uSunCol;
      uniform float uStorm;
      void main(){
        vec3 d = normalize(vDir);
        float y = clamp(d.y, 0.0, 1.0);
        vec3 col = mix(uHorizon, uZenith, pow(y, 0.5));
        vec3 warm = uHorizon * vec3(1.06, 0.88, 0.72);
        col = mix(col, warm, pow(1.0 - y, 6.0) * 0.55);
        float sd = max(dot(d, uSunDir), 0.0);
        vec3 glow = uSunCol * (pow(sd, 1000.0) * 6.0 + pow(sd, 90.0) * 1.15 + pow(sd, 7.0) * 0.30);
        col += glow * (1.0 - uStorm * 0.85);
        col = mix(col, vec3(0.55, 0.29, 0.12) * (0.8 + 0.25 * y), uStorm);
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  })
);
sky.frustumCulled = false;
scene.add(sky);

/* ============================== TERRAIN (GPU-displaced) ============================== */
const NOISE_GLSL = `
  const float C_FREQ = 0.011, C_AMP = 26.0, C_SHARP = 1.35, WA_ = 0.6, EPSN = 3.0;
  float hash2i(ivec2 ip){
    uint n = uint(ip.x) * 374761393u + uint(ip.y) * 668265263u;
    n = (n ^ (n >> 13u)) * 1274126177u;
    n = n ^ (n >> 16u);
    return float(n) / 4294967296.0;
  }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash2i(ivec2(i));
    float b = hash2i(ivec2(i) + ivec2(1, 0));
    float c = hash2i(ivec2(i) + ivec2(0, 1));
    float d = hash2i(ivec2(i) + ivec2(1, 1));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }
  float fbm(vec2 p, int oct){
    float v = 0.0, a = 0.5, t = 0.0;
    for (int i = 0; i < oct; i++){ v += a * vnoise(p); t += a; p *= 2.03; a *= 0.5; }
    return (v / t) * 2.0 - 1.0;
  }
  float crestAt(vec2 p){
    vec2 wd = vec2(cos(WA_), sin(WA_));
    float u = dot(p, wd), v = dot(p, vec2(-wd.y, wd.x));
    float wob = fbm(vec2(v * 0.0035 + 7.3, u * 0.0008), 3) * 6.0;
    return pow(abs(sin((u * C_FREQ + wob) * 3.14159265)), C_SHARP);
  }
  float duneH(vec2 p){
    float crest = crestAt(p);
    float dmod = 0.55 + 0.225 * (fbm(vec2(p.x * 0.0012 + 3.1, p.y * 0.0012), 3) + 1.0);
    return crest * C_AMP * dmod + fbm(p * 0.0009, 4) * 14.0 + vnoise(p * 0.02) * 0.55;
  }
`;

const T_SIZE = 4800, T_SEG = 340, T_SPACING = T_SIZE / T_SEG;
const tGeo = new THREE.PlaneGeometry(T_SIZE, T_SIZE, T_SEG, T_SEG);
tGeo.rotateX(-Math.PI / 2);
const sandMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.96, metalness: 0.0 });
sandMat.onBeforeCompile = (sh) => {
  sh.vertexShader = NOISE_GLSL + 'varying vec3 vSand;\n' + sh.vertexShader
    .replace('#include <beginnormal_vertex>', `
      vec2 wxz0 = (modelMatrix * vec4(position, 1.0)).xz;
      float hC = duneH(wxz0);
      float hX = duneH(wxz0 + vec2(EPSN, 0.0));
      float hZ = duneH(wxz0 + vec2(0.0, EPSN));
      vec3 objectNormal = normalize(vec3(hC - hX, EPSN, hC - hZ));
    `)
    .replace('#include <begin_vertex>', `
      vec3 transformed = vec3(position.x, position.y + hC, position.z);
      float hN = clamp(hC / 46.0 + 0.12, 0.0, 1.0);
      vec3 cA = vec3(0.42, 0.235, 0.115);
      vec3 cB = vec3(0.86, 0.60, 0.345);
      vSand = mix(cA, cB, smoothstep(0.06, 0.92, hN));
      vSand = mix(vSand, vec3(0.96, 0.75, 0.47), crestAt(wxz0) * 0.22);
      vSand *= 0.95 + 0.05 * vnoise(wxz0 * 0.55);
    `);
  sh.fragmentShader = 'varying vec3 vSand;\n' + sh.fragmentShader
    .replace('#include <color_fragment>', 'diffuseColor.rgb *= vSand;');
};
const terrain = new THREE.Mesh(tGeo, sandMat);
terrain.frustumCulled = false;
scene.add(terrain);

/* ============================== POINT SPRITES (shared shader) ============================== */
function makePointsMaterial(color, opacity){
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false,
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uPR: { value: DPR },
      uOpacity: { value: opacity }
    },
    vertexShader: `
      attribute float aAlpha;
      attribute float aSize;
      varying float vA;
      uniform float uPR, uOpacity;
      void main(){
        vA = aAlpha * uOpacity;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        float s = aSize * uPR * (260.0 / max(1.0, -mv.z));
        gl_PointSize = min(s, 260.0 * uPR);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying float vA;
      uniform vec3 uColor;
      void main(){
        float d = length(gl_PointCoord - vec2(0.5));
        float a = smoothstep(0.5, 0.1, d) * vA;
        if (a < 0.004) discard;
        gl_FragColor = vec4(uColor, a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  });
}

/* ============================== CREST SALTATION PARTICLES ============================== */
const CN = 3500;
const cPos = new Float32Array(CN * 3);
const cAlpha = new Float32Array(CN);
const cSize = new Float32Array(CN);
const cLife = new Float32Array(CN);
const cTtl = new Float32Array(CN);
const cAmax = new Float32Array(CN);
const cSeed = new Float32Array(CN);
const cSpd = new Float32Array(CN);
const cBaseY = new Float32Array(CN);
for (let i = 0; i < CN; i++){ cLife[i] = 1e9; cTtl[i] = 1; cSeed[i] = Math.random(); cSize[i] = 0.35 + Math.random() * 0.75; }
const crestGeo = new THREE.BufferGeometry();
crestGeo.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
crestGeo.setAttribute('aAlpha', new THREE.BufferAttribute(cAlpha, 1));
crestGeo.setAttribute('aSize', new THREE.BufferAttribute(cSize, 1));
const crestPts = new THREE.Points(crestGeo, makePointsMaterial(0xeab57e, 1));
crestPts.frustumCulled = false;
crestPts.visible = false;
scene.add(crestPts);

function spawnCrest(i, camX, camZ){
  const uw = 60 + Math.random() * 300;
  const pw = (Math.random() - 0.5) * 440;
  const x = camX - windDir.x * uw + perpDir.x * pw;
  const z = camZ - windDir.z * uw + perpDir.z * pw;
  const onCrest = crestAt(x, z) > 0.72;
  if (!onCrest && Math.random() < 0.8){ cTtl[i] = 0.01; cLife[i] = 1e9; cAlpha[i] = 0; return; }
  cPos[i * 3] = x;
  cPos[i * 3 + 2] = z;
  cBaseY[i] = duneHeight(x, z) + 0.12 + Math.random() * 0.4;
  cPos[i * 3 + 1] = cBaseY[i];
  cLife[i] = 0;
  cTtl[i] = 1.2 + Math.random() * 2.2;
  cAmax[i] = 0.22 + Math.random() * 0.5;
  cSpd[i] = 0.7 + Math.random() * 0.8;
  cSeed[i] = Math.random();
}

/* ============================== STORM PARTICLES ============================== */
const SN = 5000, SHALF = 130;
const sRel = new Float32Array(SN * 3);
const sPos = new Float32Array(SN * 3);
const sAlpha = new Float32Array(SN);
const sSize = new Float32Array(SN);
const sVel = new Float32Array(SN * 3);
for (let i = 0; i < SN; i++){
  sRel[i * 3]     = (Math.random() * 2 - 1) * SHALF;
  sRel[i * 3 + 1] = -8 + Math.random() * 85;
  sRel[i * 3 + 2] = (Math.random() * 2 - 1) * SHALF;
  const sp = 45 + Math.random() * 50;
  sVel[i * 3]     = windDir.x * sp + perpDir.x * (Math.random() - 0.5) * 18;
  sVel[i * 3 + 1] = -2 - Math.random() * 6;
  sVel[i * 3 + 2] = windDir.z * sp + perpDir.z * (Math.random() - 0.5) * 18;
  sAlpha[i] = 0.06 + Math.random() * 0.24;
  sSize[i] = 0.4 + Math.random() * 1.5;
}
const stormGeo = new THREE.BufferGeometry();
stormGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
stormGeo.setAttribute('aAlpha', new THREE.BufferAttribute(sAlpha, 1));
stormGeo.setAttribute('aSize', new THREE.BufferAttribute(sSize, 1));
const stormMat = makePointsMaterial(0xd0813f, 0);
const stormPts = new THREE.Points(stormGeo, stormMat);
stormPts.frustumCulled = false;
stormPts.visible = false;
scene.add(stormPts);

/* ============================== DUST WALL ============================== */
const wallFrag = `
  varying vec2 vUv;
  uniform float uTime, uAlpha, uSeed;
  float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float vn(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash21(i), hash21(i + vec2(1, 0)), u.x),
               mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), u.x), u.y);
  }
  float fbmw(vec2 p){
    float v = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++){ v += a * vn(p); p *= 2.05; a *= 0.5; }
    return v;
  }
  void main(){
    vec2 uv = vUv;
    float n  = fbmw(vec2(uv.x * 7.0 + uSeed, uv.y * 3.0 - uTime * 0.03) + uTime * 0.01);
    float n2 = fbmw(vec2(uv.x * 18.0 - uSeed * 2.0, uv.y * 8.0) - uTime * 0.055);
    float edge = uv.y + (n - 0.5) * 0.30;
    float body = smoothstep(1.0, 0.35, edge);
    float base = smoothstep(0.0, 0.06, uv.y);
    float side = smoothstep(0.0, 0.12, uv.x) * smoothstep(1.0, 0.88, uv.x);
    float a = body * base * side * (0.72 + 0.28 * n2) * uAlpha;
    if (a < 0.004) discard;
    vec3 col = mix(vec3(0.30, 0.135, 0.05), vec3(0.85, 0.47, 0.18),
                   clamp(edge + (n2 - 0.5) * 0.35, 0.0, 1.0));
    col *= 0.8 + 0.35 * n2;
    gl_FragColor = vec4(col, a);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`;
const wallVert = `
  varying vec2 vUv;
  void main(){
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }`;
const wallLayers = [];
for (let i = 0; i < 3; i++){
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(6200 + i * 900, 640 + i * 140),
    new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false,
      uniforms: {
        uTime: { value: 0 },
        uAlpha: { value: 0 },
        uSeed: { value: i * 13.7 }
      },
      vertexShader: wallVert, fragmentShader: wallFrag
    })
  );
  m.frustumCulled = false;
  m.visible = false;
  scene.add(m);
  wallLayers.push(m);
}

/* ============================== STATE ============================== */
let userWind = 6, phase = 0, approachT = 0, stormAmt = 0;
let camX = 0, camZ = 0, camY = 12;
let heading = Math.atan2(sunDir.z, sunDir.x);
const lookSm = new THREE.Vector3(-50, 8, 0);
const tintEl = document.getElementById('tint');
const hudW = document.getElementById('hudW'), hudV = document.getElementById('hudV'), hudF = document.getElementById('hudF');
const windInput = document.getElementById('wind'), windVal = document.getElementById('windVal');
const stormBtn = document.getElementById('stormBtn');

windInput.addEventListener('input', () => {
  userWind = parseFloat(windInput.value);
  windVal.textContent = userWind.toFixed(1);
});
stormBtn.addEventListener('click', () => {
  if (phase === 0){ phase = 1; stormBtn.classList.add('active'); stormBtn.textContent = 'CLEAR STORM'; }
  else if (phase === 1 || phase === 2){ phase = 3; stormBtn.classList.remove('active'); stormBtn.textContent = 'SANDSTORM'; }
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================== MAIN LOOP ============================== */
const clock = new THREE.Clock();
let t = 0, fpsSm = 60, hudTimer = 0, wallTime = 0;
const tmpColor = new THREE.Color();

camY = duneHeight(0, 0) + 7;

function animate(){
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;
  fpsSm = lerp(fpsSm, 1 / Math.max(dt, 1e-4), 0.05);

  /* storm phase machine */
  if (phase === 1){ approachT += dt / 5; if (approachT >= 1){ approachT = 1; phase = 2; } }
  else if (phase === 3){
    approachT -= dt / 4;
    if (approachT <= 0){ approachT = 0; phase = 0; stormBtn.classList.remove('active'); stormBtn.textContent = 'SANDSTORM'; }
  }
  const stormTarget = sstep(0.6, 1.0, approachT);
  stormAmt += (stormTarget - stormAmt) * Math.min(1, dt * 2.2);
  const visCurve = sstep(0.5, 0.95, approachT);
  const effWind = Math.max(userWind, 28 * stormAmt);

  /* camera drift */
  heading += (vnoise(t * 0.035, 11.31) - 0.5) * 0.55 * dt + Math.sin(t * 0.043) * 0.008 * dt;
  const fwdX = Math.cos(heading), fwdZ = Math.sin(heading);
  const speed = 9;
  camX += fwdX * speed * dt;
  camZ += fwdZ * speed * dt;
  const targetY = duneHeight(camX, camZ) + 7 + Math.sin(t * 0.5) * 1.1;
  camY += (targetY - camY) * Math.min(1, dt * 1.5);
  camera.position.set(camX, camY, camZ);

  const lx = camX + fwdX * 55, lz = camZ + fwdZ * 55;
  const ly = duneHeight(lx, lz) + 2.5;
  lookSm.x += (lx - lookSm.x) * Math.min(1, dt * 1.8);
  lookSm.y += (ly - lookSm.y) * Math.min(1, dt * 1.8);
  lookSm.z += (lz - lookSm.z) * Math.min(1, dt * 1.8);

  const shake = stormAmt * 0.5;
  if (shake > 0.001){
    camera.position.x += (vnoise(t * 9.1, 3.3) - 0.5) * shake;
    camera.position.y += (vnoise(t * 10.7, 7.9) - 0.5) * shake * 0.7;
    camera.position.z += (vnoise(t * 8.3, 5.1) - 0.5) * shake;
    lookSm.x += (vnoise(t * 7.7, 9.4) - 0.5) * shake * 6;
    lookSm.y += (vnoise(t * 8.9, 2.2) - 0.5) * shake * 4;
  }
  camera.lookAt(lookSm);
  camera.rotateZ(Math.sin(t * 0.11) * 0.018);

  /* terrain snaps to world lattice so GPU displacement is seamless */
  terrain.position.x = Math.round(camX / T_SPACING) * T_SPACING;
  terrain.position.z = Math.round(camZ / T_SPACING) * T_SPACING;
  sky.position.copy(camera.position);

  /* environment blending */
  const visFar = lerp(3000, 26, visCurve);
  scene.fog.near = lerp(300, 2, visCurve);
  scene.fog.far = visFar;
  scene.fog.color.copy(tmpColor.copy(FOG_CLEAR).lerp(FOG_STORM, stormAmt));
  sun.color.copy(tmpColor.copy(SUN_CLEAR).lerp(SUN_STORM, stormAmt));
  sun.intensity = lerp(2.6, 1.0, stormAmt);
  hemi.color.copy(tmpColor.copy(HSKY_CLEAR).lerp(HSKY_STORM, stormAmt));
  hemi.groundColor.copy(tmpColor.copy(HGND_CLEAR).lerp(HGND_STORM, stormAmt));
  hemi.intensity = lerp(0.78, 0.55, stormAmt);
  skyUniforms.uStorm.value = Math.max(stormAmt, visCurve * 0.45);
  renderer.toneMappingExposure = lerp(1.12, 0.98, stormAmt);
  tintEl.style.opacity = (stormAmt * 0.22).toFixed(3);

  /* dust wall */
  const wallActive = approachT > 0.02 && phase !== 0;
  if (wallActive){
    wallTime += dt * (phase === 3 ? 0.3 : 1);
    const D = lerp(2600, 30, Math.pow(approachT, 1.7));
    const nearFade = sstep(20, 120, D);
    for (let i = 0; i < 3; i++){
      const w = wallLayers[i];
      const Di = D + i * 190;
      w.visible = true;
      w.position.set(
        camera.position.x - windDir.x * Di,
        100 + i * 24,
        camera.position.z - windDir.z * Di
      );
      w.lookAt(camera.position.x, w.position.y, camera.position.z);
      w.material.uniforms.uTime.value = wallTime;
      w.material.uniforms.uAlpha.value =
        Math.min(approachT * 4, 1) * (i === 0 ? 0.96 : 0.65) * nearFade;
    }
  } else {
    for (const w of wallLayers) w.visible = false;
  }

  /* crest saltation */
  const actN = Math.floor(CN * Math.min(1, Math.max(0, (effWind - 3.5) / 10)));
  if (actN > 2){
    crestPts.visible = true;
    const alphaScale = Math.min(1, effWind / 18);
    for (let i = 0; i < actN; i++){
      cLife[i] += dt;
      const dx = cPos[i * 3] - camX, dz = cPos[i * 3 + 2] - camZ;
      if (cLife[i] >= cTtl[i] || dx * dx + dz * dz > 560 * 560) spawnCrest(i, camX, camZ);
      if (cLife[i] > 1e8) continue;
      const w = cSpd[i] * (2.0 + effWind * 1.5);
      const tb = Math.sin(t * 2.1 + cSeed[i] * 20.0) * effWind * 0.18;
      cPos[i * 3]     += (windDir.x * w + perpDir.x * tb) * dt;
      cPos[i * 3 + 2] += (windDir.z * w + perpDir.z * tb) * dt;
      const hop = Math.abs(Math.sin(cLife[i] * 5.0 + cSeed[i] * 30.0)) * (0.4 + effWind * 0.05);
      cPos[i * 3 + 1] = cBaseY[i] + hop + cLife[i] * 0.25;
      const l = cLife[i], tl = cTtl[i];
      cAlpha[i] = cAmax[i] * alphaScale * smooth01(l / 0.18) * smooth01((tl - l) / 0.5);
    }
    for (let i = actN; i < CN; i++) cAlpha[i] = 0;
    crestGeo.attributes.position.needsUpdate = true;
    crestGeo.attributes.aAlpha.needsUpdate = true;
  } else {
    crestPts.visible = false;
  }

  /* storm particles */
  if (stormAmt > 0.02){
    stormPts.visible = true;
    stormMat.uniforms.uOpacity.value = stormAmt;
    const cx = camera.position.x, cy = camera.position.y, cz = camera.position.z;
    for (let i = 0; i < SN; i++){
      let rx = sRel[i * 3]     + sVel[i * 3] * dt;
      let ry = sRel[i * 3 + 1] + sVel[i * 3 + 1] * dt;
      let rz = sRel[i * 3 + 2] + sVel[i * 3 + 2] * dt;
      rx = ((rx + SHALF) % (2 * SHALF) + 2 * SHALF) % (2 * SHALF) - SHALF;
      rz = ((rz + SHALF) % (2 * SHALF) + 2 * SHALF) % (2 * SHALF) - SHALF;
      if (ry < -10) ry += 90; else if (ry > 80) ry -= 90;
      sRel[i * 3] = rx; sRel[i * 3 + 1] = ry; sRel[i * 3 + 2] = rz;
      sPos[i * 3] = cx + rx; sPos[i * 3 + 1] = cy - 6 + ry; sPos[i * 3 + 2] = cz + rz;
    }
    stormGeo.attributes.position.needsUpdate = true;
  } else {
    stormPts.visible = false;
  }

  /* HUD */
  hudTimer += dt;
  if (hudTimer > 0.25){
    hudTimer = 0;
    const baseVis = 9000 - userWind * 90;
    const vis = lerp(baseVis, 14, visCurve);
    hudW.textContent = effWind.toFixed(1) + ' m/s';
    hudV.textContent = vis >= 1000 ? (vis / 1000).toFixed(1) + ' km' : Math.max(1, Math.round(vis)) + ' m';
    hudF.textContent = Math.round(fpsSm);
  }

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);
</script>
